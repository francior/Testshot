<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My App</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f7; }
    header { background: #fff; padding: 16px; border-bottom: 1px solid #ddd; }
    h1 { margin: 0; font-size: 20px; }
    main { padding: 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 12px 18px; font-size: 16px; border: none; border-radius: 8px;
             background: #000; color: #fff; cursor: pointer; }
    li { background: #fff; padding: 14px; margin-bottom: 8px; border-radius: 8px;
         display: flex; justify-content: space-between; align-items: center; }
    ul { list-style: none; padding: 0; }
    .x { background: none; color: #999; padding: 0 6px; font-size: 20px; }
  </style>
</head>
<body>

  <header><h1>My App</h1></header>

  <main>
    <div class="row">
      <input id="box" placeholder="Type something">
      <button onclick="add()">Add</button>
    </div>
    <ul id="list"></ul>
  </main>

  <script>
    let items = JSON.parse(localStorage.getItem('items') || '[]');

    function save() {
      localStorage.setItem('items', JSON.stringify(items));
      draw();
    }

    function add() {
      const box = document.getElementById('box');
      if (!box.value.trim()) return;
      items.push(box.value.trim());
      box.value = '';
      save();
    }

    function remove(i) {
      items.splice(i, 1);
      save();
    }

    function draw() {
      document.getElementById('list').innerHTML = items
        .map((t, i) => `<li>${t}<button class="x" onclick="remove(${i})">×</button></li>`)
        .join('');
    }

    draw();
