<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My App</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f7; }
    header { background: #fff; padding: 16px; border-bottom: 1px solid #ddd; }
    h1 { margin: 0; font-size: 20px; }
    nav { display: flex; background: #fff; border-bottom: 1px solid #ddd; }
    nav button { flex: 1; padding: 14px; border: none; background: none; font-size: 15px;
                 cursor: pointer; color: #666; border-bottom: 3px solid transparent; }
    nav button.active { color: #000; font-weight: 600; border-bottom-color: #000; }
    .panel { display: none; padding: 20px; }
    .panel.active { display: block; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    .add { padding: 12px 18px; font-size: 16px; border: none; border-radius: 8px;
           background: #000; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; padding: 14px; margin-bottom: 8px; border-radius: 8px;
         display: flex; justify-content: space-between; align-items: center; }
    .x { background: none; border: none; color: #999; font-size: 20px; cursor: pointer; }

    /* --- game --- */
    #game { max-width: 640px; }
    .fighters { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .unit { background: #fff; border-radius: 10px; padding: 14px; flex: 1; }
    .unit h3 { margin: 0 0 8px; font-size: 16px; }
    .bar { background: #eee; border-radius: 5px; height: 10px; overflow: hidden; margin-bottom: 6px; }
    .bar span { display: block; height: 100%; background: #d33; }
    .stat { font-size: 13px; color: #555; }
    .intent { margin-top: 8px; font-size: 13px; font-weight: 600; color: #b00; }
    .block { color: #06c; font-weight: 600; }
    .log { background: #fff; border-radius: 8px; padding: 10px 12px; font-size: 13px;
           color: #555; margin-bottom: 12px; min-height: 18px; }
    .hand { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .card { background: #fff; border: 2px solid #ddd; border-radius: 10px; padding: 10px;
            width: 96px; cursor: pointer; text-align: center; }
    .card:hover { border-color: #000; }
    .card.dead { opacity: .4; cursor: not-allowed; }
    .card b { display: block; font-size: 13px; margin-bottom: 4px; }
    .card small { color: #666; font-size: 11px; }
    .cost { background: #000; color: #fff; border-radius: 50%; width: 20px; height: 20px;
            line-height: 20px; font-size: 12px; margin: 0 auto 6px; }
    .bigbtn { padding: 12px 20px; font-size: 15px; border: none; border-radius: 8px;
              background: #000; color: #fff; cursor: pointer; }
    .piles { font-size: 12px; color: #888; margin-top: 10px; }
    .loot { background: #fff; border-radius: 10px; padding: 16px; }
  </style>
</head>
<body>

  <header><h1>My App</h1></header>

  <nav>
    <button class="active" onclick="show('home', this)">Home</button>
    <button onclick="show('list', this)">List</button>
    <button onclick="show('game', this)">Game</button>
  </nav>

  <div id="home" class="panel active">
    <h2>Home</h2>
    <p>This is the first tab.</p>
  </div>

  <div id="list" class="panel">
    <div class="row">
      <input id="box" placeholder="Type something">
      <button class="add" onclick="add()">Add</button>
    </div>
    <ul id="items"></ul>
  </div>

  <div id="game" class="panel"></div>

  <script>
    // ---- tabs ----
    function show(id, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }

    // ---- saved list ----
    let items = JSON.parse(localStorage.getItem('items') || '[]');
    function save() { localStorage.setItem('items', JSON.stringify(items)); draw(); }
    function add() {
      const box = document.getElementById('box');
      if (!box.value.trim()) return;
      items.push(box.value.trim());
      box.value = '';
      save();
    }
    function remove(i) { items.splice(i, 1); save(); }
    function draw() {
      document.getElementById('items').innerHTML = items
        .map((t, i) => `<li>${t}<button class="x" onclick="remove(${i})">&times;</button></li>`)
        .join('');
    }
    draw();

    // ================= CARD GAME =================

    // every card in the game lives here
    const CARDS = {
      strike:  { name: 'Strike',    cost: 1, text: 'Deal 6',            play: () => hit(6) },
      defend:  { name: 'Defend',    cost: 1, text: 'Gain 5 block',      play: () => { me.block += 5; } },
      bash:    { name: 'Bash',      cost: 2, text: 'Deal 12',           play: () => hit(12) },
      jab:     { name: 'Quick Jab', cost: 0, text: 'Deal 3',            play: () => hit(3) },
      wall:    { name: 'Iron Wall', cost: 2, text: 'Gain 12 block',     play: () => { me.block += 12; } },
      drain:   { name: 'Drain',     cost: 1, text: 'Deal 4, heal 3',    play: () => { hit(4); me.hp = Math.min(me.maxHp, me.hp + 3); } },
      flurry:  { name: 'Flurry',    cost: 1, text: 'Deal 5, draw 1',    play: () => { hit(5); drawCards(1); } },
      brace:   { name: 'Brace',     cost: 0, text: 'Gain 3 block',      play: () => { me.block += 3; } },
    };

    // cards that can show up as loot
    const LOOT_POOL = ['bash', 'jab', 'wall', 'drain', 'flurry', 'brace', 'strike', 'defend'];

    let me, foe, deck, hand, discard, energy, floor, log, phase, lootChoices;

    function newRun() {
      me = { hp: 40, maxHp: 40, block: 0 };
      deck = ['strike','strike','strike','strike','defend','defend','defend','defend','bash'];
      floor = 0;
      nextFight();
    }

    function nextFight() {
      floor++;
      foe = {
        name: 'Enemy ' + floor,
        hp: 10 + floor * 5,
        maxHp: 10 + floor * 5,
        block: 0,
        intent: null
      };
      discard = [];
      hand = [];
      shuffleDeck();
      pickIntent();
      log = 'Floor ' + floor + '. A fight begins.';
      phase = 'fight';
      startTurn();
    }

    function shuffleDeck() {
      // Fisher-Yates: walk backwards, swap each card with a random earlier one
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    function drawCards(n) {
      for (let i = 0; i < n; i++) {
        if (deck.length === 0) {
          if (discard.length === 0) return;   // nothing left anywhere
          deck = discard;
          discard = [];
          shuffleDeck();
        }
        hand.push(deck.pop());
      }
    }

    function startTurn() {
      me.block = 0;          // block only lasts one enemy turn
      energy = 3;
      drawCards(5);
      render();
    }

    function hit(dmg) {
      const through = Math.max(0, dmg - foe.block);
      foe.block = Math.max(0, foe.block - dmg);
      foe.hp -= through;
    }

    function playCard(i) {
      const card = CARDS[hand[i]];
      if (card.cost > energy) return;

      energy -= card.cost;
      hand.splice(i, 1);          // take it out of hand BEFORE it runs
      discard.push(card === CARDS.strike ? 'strike' : keyOf(card));
      card.play();

      if (foe.hp <= 0) { winFight(); return; }
      render();
    }

    function keyOf(card) {
      return Object.keys(CARDS).find(k => CARDS[k] === card);
    }

    function pickIntent() {
      // 70% attack, 30% defend
      if (Math.random() < 0.7) {
        foe.intent = { type: 'attack', value: 4 + floor * 2 };
      } else {
        foe.intent = { type: 'block', value: 5 + floor };
      }
    }

    function endTurn() {
      discard = discard.concat(hand);
      hand = [];

      foe.block = 0;
      if (foe.intent.type === 'attack') {
        const dmg = foe.intent.value;
        const through = Math.max(0, dmg - me.block);
        me.block = Math.max(0, me.block - dmg);
        me.hp -= through;
        log = foe.name + ' attacks for ' + dmg + (through < dmg ? ' (blocked some)' : '') + '.';
      } else {
        foe.block += foe.intent.value;
        log = foe.name + ' braces for ' + foe.intent.value + '.';
      }

      if (me.hp <= 0) { phase = 'dead'; render(); return; }

      pickIntent();
      startTurn();
    }

    function winFight() {
      phase = 'loot';
      lootChoices = [];
      while (lootChoices.length < 3) {
        const pick = LOOT_POOL[Math.floor(Math.random() * LOOT_POOL.length)];
        if (!lootChoices.includes(pick)) lootChoices.push(pick);
      }
      render();
    }

    function takeLoot(key) {
      deck.push(key);
      me.hp = Math.min(me.maxHp, me.hp + 5);   // small heal between fights
      nextFight();
    }

    function skipLoot() { nextFight(); }

    function render() {
      const g = document.getElementById('game');

      if (phase === 'dead') {
        g.innerHTML = `
          <div class="loot">
            <h2>You died on floor ${floor}</h2>
            <p>Your deck had ${deck.length + discard.length + hand.length} cards.</p>
            <button class="bigbtn" onclick="newRun()">New run</button>
          </div>`;
        return;
      }

      if (phase === 'loot') {
        g.innerHTML = `
          <div class="loot">
            <h2>Victory — floor ${floor}</h2>
            <p>Add a card to your deck:</p>
            <div class="hand">
              ${lootChoices.map(k => `
                <div class="card" onclick="takeLoot('${k}')">
                  <div class="cost">${CARDS[k].cost}</div>
                  <b>${CARDS[k].name}</b>
                  <small>${CARDS[k].text}</small>
                </div>`).join('')}
            </div>
            <button class="bigbtn" onclick="skipLoot()">Skip</button>
          </div>`;
        return;
      }

      g.innerHTML = `
        <div class="fighters">
          <div class="unit">
            <h3>You</h3>
            <div class="bar"><span style="width:${me.hp / me.maxHp * 100}%"></span></div>
            <div class="stat">${me.hp} / ${me.maxHp} HP
              ${me.block ? `&nbsp;<span class="block">${me.block} block</span>` : ''}</div>
            <div class="stat">Energy: ${energy} / 3</div>
          </div>
          <div class="unit">
            <h3>${foe.name}</h3>
            <div class="bar"><span style="width:${Math.max(0, foe.hp) / foe.maxHp * 100}%"></span></div>
            <div class="stat">${Math.max(0, foe.hp)} / ${foe.maxHp} HP
              ${foe.block ? `&nbsp;<span class="block">${foe.block} block</span>` : ''}</div>
            <div class="intent">${foe.intent.type === 'attack'
              ? 'Will attack for ' + foe.intent.value
              : 'Will block ' + foe.intent.value}</div>
          </div>
        </div>

        <div class="log">${log}</div>

        <div class="hand">
          ${hand.map((k, i) => `
            <div class="card ${CARDS[k].cost > energy ? 'dead' : ''}" onclick="playCard(${i})">
              <div class="cost">${CARDS[k].cost}</div>
              <b>${CARDS[k].name}</b>
              <small>${CARDS[k].text}</small>
            </div>`).join('')}
        </div>

        <button class="bigbtn" onclick="endTurn()">End turn</button>
        <div class="piles">Draw pile: ${deck.length} &nbsp;·&nbsp; Discard: ${discard.length} &nbsp;·&nbsp; Deck size: ${deck.length + discard.length + hand.length}</div>
      `;
    }

    newRun();
  </script>

</body>
</html>
