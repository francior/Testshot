<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My App</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f7; }
    header { background: #fff; padding: 16px; border-bottom: 1px solid #ddd; }
    h1 { margin: 0; font-size: 20px; }
    nav { display: flex; background: #fff; border-bottom: 1px solid #ddd; }
    nav button { flex: 1; padding: 14px; border: none; background: none; font-size: 15px;
                 cursor: pointer; color: #666; border-bottom: 3px solid transparent; }
    nav button.active { color: #000; font-weight: 600; border-bottom-color: #000; }
    .panel { display: none; padding: 20px; }
    .panel.active { display: block; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    .add { padding: 12px 18px; font-size: 16px; border: none; border-radius: 8px;
           background: #000; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; padding: 14px; margin-bottom: 8px; border-radius: 8px;
         display: flex; justify-content: space-between; align-items: center; }
    .x { background: none; border: none; color: #999; font-size: 20px; cursor: pointer; }
    canvas { background: #fff; border-radius: 8px; width: 100%; max-width: 480px; display: block; }
    .hint { color: #666; font-size: 14px; }
  </style>
</head>
<body>

  <header><h1>My App</h1></header>

  <nav>
    <button class="active" onclick="show('home', this)">Home</button>
    <button onclick="show('list', this)">List</button>
    <button onclick="show('game', this)">Game</button>
  </nav>

  <div id="home" class="panel active">
    <h2>Home</h2>
    <p>This is the first tab.</p>
  </div>

  <div id="list" class="panel">
    <div class="row">
      <input id="box" placeholder="Type something">
      <button class="add" onclick="add()">Add</button>
    </div>
    <ul id="items"></ul>
  </div>

  <div id="game" class="panel">
    <canvas id="cv" width="480" height="320"></canvas>
    <p class="hint">Click the canvas, then use WASD to move.</p>
  </div>

  <script>
    // ---- tabs ----
    function show(id, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }

    // ---- saved list ----
    let items = JSON.parse(localStorage.getItem('items') || '[]');
    function save() { localStorage.setItem('items', JSON.stringify(items)); draw(); }
    function add() {
      const box = document.getElementById('box');
      if (!box.value.trim()) return;
      items.push(box.value.trim());
      box.value = '';
      save();
    }
    function remove(i) { items.splice(i, 1); save(); }
    function draw() {
      document.getElementById('items').innerHTML = items
        .map((t, i) => `<li>${t}<button class="x" onclick="remove(${i})">&times;</button></li>`)
        .join('');
    }
    draw();

    // ---- game ----
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const player = { x: 220, y: 140, speed: 2.5, facing: 1 };
    const keys = {};
    let step = 0;

    document.addEventListener('keydown', e => {
      if (document.activeElement.tagName === 'INPUT') return;
      keys[e.key.toLowerCase()] = true;
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function drawGuy(x, y, swing, facing) {
      ctx.strokeStyle = '#000';
      ctx.fillStyle = '#000';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.arc(x, y - 26, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x, y - 19);
      ctx.lineTo(x, y - 6);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x - 9, y - 10 + swing * 4);
      ctx.lineTo(x, y - 16);
      ctx.lineTo(x + 9, y - 10 - swing * 4);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x - 7, y + 8 - Math.abs(swing) * 2);
      ctx.lineTo(x, y - 6);
      ctx.lineTo(x + 7, y + 8 - Math.abs(swing) * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x + facing * 4, y - 27, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }

    function loop() {
      let moving = false;

      if (keys['w']) { player.y -= player.speed; moving = true; }
      if (keys['s']) { player.y += player.speed; moving = true; }
      if (keys['a']) { player.x -= player.speed; moving = true; player.facing = -1; }
      if (keys['d']) { player.x += player.speed; moving = true; player.facing =  1; }

      player.x = Math.max(12, Math.min(cv.width  - 12, player.x));
      player.y = Math.max(30, Math.min(cv.height - 12, player.y));

      if (moving) step += 0.2; else step = 0;

      ctx.clearRect(0, 0, cv.width, cv.height);
      drawGuy(player.x, player.y, Math.sin(step), player.facing);

      requestAnimationFrame(loop);
    }
    loop();
  </script>

</body>
</html>
